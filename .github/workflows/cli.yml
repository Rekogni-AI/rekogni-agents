name: CLI

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
